<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Wander With Suzy</title>
  <meta name="description" content="A travel story from Wander With Suzy." />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,700;1,500&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet" />

  <style>
    :root {
      --cream: #FFF8F0;
      --cream-deep: #F6EADB;
      --coral: #FF6B6B;
      --coral-dark: #E85555;
      --forest: #2D6A4F;
      --ink: #2B2B2B;
      --muted: #6B6560;
      --card: #FFFFFF;
      --radius: 16px;
      --shadow: 0 10px 30px rgba(45, 106, 79, 0.10);
      --shadow-hover: 0 22px 48px rgba(45, 106, 79, 0.18);
      --serif: "Playfair Display", Georgia, serif;
      --sans: "DM Sans", system-ui, -apple-system, sans-serif;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
      background: var(--cream);
      color: var(--ink);
      font-family: var(--sans);
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }
    img { max-width: 100%; display: block; }
    a { color: inherit; }

    .container { width: 100%; max-width: 1180px; margin: 0 auto; padding: 0 24px; }
    .narrow { max-width: 720px; }
    .wide { max-width: 1000px; }

    /* ---------- Navigation (shared) ---------- */
    .nav {
      position: sticky; top: 0; z-index: 1000;
      background: rgba(255, 248, 240, 0.92);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border-bottom: 1px solid rgba(45, 106, 79, 0.12);
    }
    .nav-inner {
      display: flex; align-items: center; justify-content: space-between;
      height: 68px;
    }
    .logo {
      font-family: var(--serif); font-weight: 700; font-size: 1.35rem;
      color: var(--forest); text-decoration: none;
    }
    .logo span { color: var(--coral); }
    .nav-links { display: flex; gap: 36px; list-style: none; }
    .nav-links a {
      text-decoration: none; font-weight: 500; color: var(--forest);
      position: relative; padding: 4px 0;
    }
    .nav-links a::after {
      content: ""; position: absolute; left: 0; bottom: -2px;
      width: 0; height: 2px; background: var(--coral);
      transition: width .25s ease;
    }
    .nav-links a:hover::after, .nav-links a.active::after { width: 100%; }

    .nav-toggle {
      display: none; background: none; border: 0; cursor: pointer;
      width: 44px; height: 44px; align-items: center; justify-content: center;
    }
    .nav-toggle span, .nav-toggle span::before, .nav-toggle span::after {
      display: block; width: 22px; height: 2px; background: var(--forest);
      position: relative; transition: transform .25s ease, background .25s ease;
    }
    .nav-toggle span::before, .nav-toggle span::after { content: ""; position: absolute; left: 0; }
    .nav-toggle span::before { top: -7px; }
    .nav-toggle span::after { top: 7px; }
    .nav-toggle[aria-expanded="true"] span { background: transparent; }
    .nav-toggle[aria-expanded="true"] span::before { transform: translateY(7px) rotate(45deg); }
    .nav-toggle[aria-expanded="true"] span::after { transform: translateY(-7px) rotate(-45deg); }

    /* ---------- Reading progress ---------- */
    .progress {
      position: fixed; top: 0; left: 0; height: 3px; width: 0;
      background: var(--coral); z-index: 1001;
    }

    /* ---------- Article header ---------- */
    .post-head { padding: 56px 0 36px; text-align: center; }
    .back {
      display: inline-flex; align-items: center; gap: 6px;
      color: var(--forest); font-weight: 500; text-decoration: none; font-size: .95rem;
      margin-bottom: 28px;
    }
    .back:hover { color: var(--coral-dark); }
    .meta {
      display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 8px 14px;
      font-size: .88rem; color: var(--muted); margin-bottom: 16px;
    }
    .tag {
      font-size: .7rem; font-weight: 700; letter-spacing: .12em; text-transform: uppercase;
      color: var(--forest); background: rgba(45, 106, 79, 0.1);
      padding: 4px 12px; border-radius: 999px;
    }
    .meta time { color: var(--coral); font-weight: 700; }
    .post-head h1 {
      font-family: var(--serif); font-weight: 700; color: var(--forest);
      font-size: clamp(2.1rem, 5.5vw, 3.6rem); line-height: 1.1;
    }
    .dek {
      font-family: var(--serif); font-style: italic; color: var(--muted);
      font-size: clamp(1.05rem, 2.2vw, 1.3rem); margin: 18px auto 0; max-width: 46ch;
    }

    .hero-img {
      border-radius: 20px; overflow: hidden; box-shadow: var(--shadow);
      aspect-ratio: 16 / 9; background: var(--cream-deep);
    }
    .hero-img img { width: 100%; height: 100%; object-fit: cover; }
    .caption { text-align: center; font-size: .82rem; color: var(--muted); margin-top: 10px; }

    /* ---------- Article body ---------- */
    .article { padding: 48px 0 24px; }
    .article p, .article li { font-size: 1.1rem; line-height: 1.8; }
    .article > p { margin-bottom: 22px; }
    .article > p:first-child::first-letter {
      font-family: var(--serif); font-weight: 700; color: var(--coral);
      float: left; font-size: 4.2rem; line-height: .9; padding: 6px 12px 0 0;
    }
    .article h2 {
      font-family: var(--serif); color: var(--forest);
      font-size: clamp(1.5rem, 3vw, 1.9rem); line-height: 1.25;
      margin: 44px 0 14px;
    }
    .article ul { margin: 0 0 22px 1.3em; }
    .article li { margin-bottom: 10px; }
    .article li::marker { color: var(--coral); }
    .article strong { color: var(--forest); }

    .tip-box {
      background: var(--card); border-left: 5px solid var(--coral);
      border-radius: 0 var(--radius) var(--radius) 0;
      padding: 26px 30px 12px; margin: 40px 0; box-shadow: var(--shadow);
    }
    .tip-box h3 {
      font-family: var(--serif); color: var(--coral); font-size: 1.35rem; margin-bottom: 12px;
    }
    .tip-box ul { margin-left: 1.2em; }
    .tip-box li { font-size: 1rem; }

    /* ---------- Author ---------- */
    .author {
      display: flex; align-items: center; gap: 20px;
      border-top: 1px solid rgba(45,106,79,0.15); border-bottom: 1px solid rgba(45,106,79,0.15);
      padding: 26px 0; margin: 24px 0 0;
    }
    .author img {
      width: 72px; height: 72px; border-radius: 50%; object-fit: cover; flex-shrink: 0;
      border: 3px solid #fff; box-shadow: var(--shadow); background: var(--cream-deep);
    }
    .author strong { font-family: var(--serif); color: var(--forest); font-size: 1.15rem; display: block; }
    .author p { color: var(--muted); font-size: .95rem; }
    .author a { color: var(--coral); font-weight: 700; text-decoration: none; }
    .author a:hover { text-decoration: underline; }

    /* ---------- Prev / next ---------- */
    .more { padding: 64px 0 96px; }
    .more h2 {
      font-family: var(--serif); color: var(--forest); text-align: center;
      font-size: clamp(1.8rem, 4vw, 2.4rem); margin-bottom: 32px;
    }
    .pager { display: grid; grid-template-columns: 1fr 1fr; gap: 28px; }
    .pager-card {
      display: flex; flex-direction: column; text-decoration: none;
      background: var(--card); border-radius: var(--radius); overflow: hidden;
      box-shadow: var(--shadow); transition: transform .3s ease, box-shadow .3s ease;
    }
    .pager-card:hover, .pager-card:focus-visible { transform: scale(1.02); box-shadow: var(--shadow-hover); }
    .pager-card .thumb { aspect-ratio: 16 / 9; overflow: hidden; background: var(--cream-deep); }
    .pager-card img { width: 100%; height: 100%; object-fit: cover; }
    .pager-card .body { padding: 20px 24px 24px; }
    .pager-card .dir {
      font-size: .78rem; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--coral);
    }
    .pager-card h3 {
      font-family: var(--serif); color: var(--forest); font-size: 1.25rem; line-height: 1.3; margin-top: 6px;
    }
    .pager-card .place { color: var(--muted); font-size: .9rem; margin-top: 4px; }

    /* ---------- Not found ---------- */
    .not-found { padding: 120px 0; text-align: center; }
    .not-found h1 { font-family: var(--serif); color: var(--forest); font-size: 2.6rem; }
    .not-found p { color: var(--muted); margin: 12px 0 28px; }
    .btn {
      display: inline-flex; align-items: center; gap: 8px;
      background: var(--coral); color: #fff; text-decoration: none;
      font-weight: 700; padding: 14px 30px; border-radius: 999px;
      box-shadow: 0 8px 20px rgba(255, 107, 107, 0.35);
    }
    .btn:hover { background: var(--coral-dark); }


    /* ---------- Responsive ---------- */
    @media (max-width: 720px) {
      .container { padding: 0 16px; }
      .nav-toggle { display: inline-flex; }
      .nav-links {
        position: absolute; top: 68px; left: 0; right: 0;
        flex-direction: column; gap: 0; background: var(--cream);
        border-bottom: 1px solid rgba(45,106,79,0.12);
        max-height: 0; overflow: hidden; transition: max-height .3s ease;
      }
      .nav-links.open { max-height: 240px; }
      .nav-links li a { display: block; padding: 16px 24px; }
      .nav-links a::after { display: none; }

      .post-head { padding: 36px 0 28px; }
      .hero-img { border-radius: 14px; }
      .article { padding-top: 36px; }
      .article p, .article li { font-size: 1.03rem; }
      .tip-box { padding: 22px 20px 8px; }
      .author { align-items: flex-start; }
      .author img { width: 56px; height: 56px; }
      .pager { grid-template-columns: 1fr; gap: 20px; }
      .more { padding: 48px 0 64px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { transition: none !important; scroll-behavior: auto !important; }
      .pager-card:hover, .pager-card:focus-visible { transform: none; }
    }
  </style>
  <link rel="stylesheet" href="footer.css" />
  <script src="reveal.js" defer></script>
</head>
<body>
  <div class="progress" id="progress" aria-hidden="true"></div>

  <!-- Sticky Navigation -->
  <nav class="nav" aria-label="Main navigation">
    <div class="container nav-inner">
      <a href="index.html" class="logo">Wander<span>.</span>Suzy</a>
      <button class="nav-toggle" aria-label="Toggle menu" aria-expanded="false" aria-controls="nav-links">
        <span></span>
      </button>
      <ul class="nav-links" id="nav-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="blog.html" class="active">Blog</a></li>
        <li><a href="about.html">About</a></li>
      </ul>
    </div>
  </nav>

  <main id="main"></main>

  <footer class="site-footer">
    <div class="container footer-inner">
      <div>
        <a href="index.html" class="logo">Wander<span>.</span>Suzy</a>
        <p class="copyright">&copy; 2025 Wander With Suzy</p>
      </div>

      <!-- Replace these links with Suzy's real profile URLs -->
      <ul class="socials" aria-label="Suzy on social media">
        <li>
          <a href="https://www.instagram.com/" target="_blank" rel="noopener" aria-label="Instagram">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1.2" fill="currentColor" stroke="none"/></svg>
          </a>
        </li>
        <li>
          <a href="https://www.youtube.com/" target="_blank" rel="noopener" aria-label="YouTube">
            <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M23 7.2a3 3 0 0 0-2.1-2.1C19 4.6 12 4.6 12 4.6s-7 0-8.9.5A3 3 0 0 0 1 7.2 31 31 0 0 0 .5 12a31 31 0 0 0 .5 4.8 3 3 0 0 0 2.1 2.1c1.9.5 8.9.5 8.9.5s7 0 8.9-.5a3 3 0 0 0 2.1-2.1 31 31 0 0 0 .5-4.8 31 31 0 0 0-.5-4.8zM9.75 15.02V8.98L15.5 12l-5.75 3.02z"/></svg>
          </a>
        </li>
        <li>
          <a href="https://x.com/" target="_blank" rel="noopener" aria-label="X (formerly Twitter)">
            <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>
          </a>
        </li>
      </ul>

      <a href="#top" class="back-to-top">Back to top <span class="arrow" aria-hidden="true">↑</span></a>
    </div>
    <div class="container">
      <p class="credit">Destination photos: <a href="https://commons.wikimedia.org/">Wikimedia Commons</a> contributors (CC licensed).</p>
    </div>
  </footer>

  <script src="posts.js"></script>
  <script>
    const main = document.getElementById("main");
    const posts = window.POSTS || [];
    const slug = new URLSearchParams(location.search).get("p");
    const index = posts.findIndex(p => p.slug === slug);
    const fmt = new Intl.DateTimeFormat("en-US", { year: "numeric", month: "long", day: "numeric" });
    const fmtDate = d => fmt.format(new Date(d + "T12:00:00"));

    if (index === -1) {
      document.title = "Story not found — Wander With Suzy";
      main.innerHTML = `
        <section class="not-found">
          <div class="container">
            <h1>Lost on the road</h1>
            <p>We couldn't find that story. It may have moved, or the link might be mistyped.</p>
            <a href="blog.html" class="btn">Browse all stories</a>
          </div>
        </section>`;
    } else {
      const post = posts[index];
      // Posts are listed newest first, so "previous" is the next item in the list.
      const older = posts[index + 1];
      const newer = posts[index - 1];

      document.title = `${post.title} — Wander With Suzy`;
      document.querySelector('meta[name="description"]').setAttribute("content", post.excerpt);

      const pagerCard = (p, label) => p ? `
        <a class="pager-card" href="post.html?p=${p.slug}">
          <div class="thumb"><img src="${p.image}" alt="" loading="lazy" /></div>
          <div class="body">
            <span class="dir">${label}</span>
            <h3>${p.title}</h3>
            <div class="place">${p.place}</div>
          </div>
        </a>` : "";

      main.innerHTML = `
        <header class="post-head">
          <div class="container narrow">
            <a href="blog.html" class="back">← All stories</a>
            <div class="meta">
              <span class="tag">${post.category}</span>
              <time datetime="${post.date}">${fmtDate(post.date)}</time>
              <span>${post.place}</span>
              <span>· ${post.readTime} min read</span>
            </div>
            <h1>${post.title}</h1>
            <p class="dek">${post.excerpt}</p>
          </div>
        </header>

        <div class="container wide">
          <figure>
            <div class="hero-img"><img src="${post.image}" alt="${post.imageAlt}" /></div>
            <figcaption class="caption">${post.imageAlt}. Photo: Wikimedia Commons.</figcaption>
          </figure>
        </div>

        <div class="container narrow">
          <article class="article">${post.body}</article>
          <aside class="author">
            <img src="https://picsum.photos/seed/suzy-headshot/160/160" alt="Suzy" />
            <div>
              <strong>Written by Suzy</strong>
              <p>Lisbon-based travel writer and food chaser, collecting stories from every corner of the world. <a href="about.html">More about me →</a></p>
            </div>
          </aside>
        </div>

        <section class="more">
          <div class="container wide">
            <h2>Keep Wandering</h2>
            <div class="pager">
              ${pagerCard(newer, "← Newer story")}
              ${pagerCard(older, "Older story →")}
            </div>
          </div>
        </section>`;
    }

    // ---------- Reading progress bar ----------
    const bar = document.getElementById("progress");
    const updateProgress = () => {
      const max = document.documentElement.scrollHeight - innerHeight;
      bar.style.width = max > 0 ? (scrollY / max) * 100 + "%" : "0";
    };
    addEventListener("scroll", updateProgress, { passive: true });
    addEventListener("resize", updateProgress);
    updateProgress();

    // ---------- Mobile nav ----------
    const toggle = document.querySelector(".nav-toggle");
    const links = document.getElementById("nav-links");
    toggle.addEventListener("click", () => {
      const open = links.classList.toggle("open");
      toggle.setAttribute("aria-expanded", String(open));
    });

  </script>
</body>
</html>
